- project_id: document_intelligence_etl_pipeline
  name: Document Intelligence ETL Pipeline
  context: AI engineering internship and portfolio project
  status: developed
  summary: A modular AI document ETL pipeline that converts mathematics worksheet PDFs into structured,
    analysis-ready records.
  problem: Extract structured mathematical questions from variable PDF sources containing scanned pages,
    layouts, text and mathematical notation.
  workflow:
  - Discover PDF sources from target websites.
  - Download, normalise and deduplicate PDFs.
  - Render PDF pages as cleaned images.
  - Detect question boundaries using LayoutLMv3 signals and classical computer-vision heuristics.
  - Crop regions and perform Mathpix OCR to Markdown and LaTeX-friendly text.
  - Score extraction quality using heuristics.
  - Transform outputs into structured question-level records.
  - Persist records to PostgreSQL and JSONL-compatible outputs.
  - Package the pipeline with Docker and automated pytest quality gates.
  technologies:
  - Python
  - Jupyter
  - requests
  - Beautiful Soup
  - Selenium or Playwright patterns
  - OpenCV
  - LayoutLMv3
  - Hugging Face Transformers
  - Mathpix API
  - PostgreSQL
  - JSONL
  - Docker
  - pytest
  - Amazon S3
  - Amazon Athena
  - RAG
  - LLMs
  - embeddings
  - vector databases
  outcomes:
  - claim_id: claim_doc_intelligence_preprocessing_50
    statement: Improved data quality and preprocessing by approximately 50%.
    verification_status: source_supported_needs_underlying_evidence
  - claim_id: claim_doc_intelligence_position_80
    statement: Achieved approximately 80% positional accuracy for region detection.
    verification_status: source_supported_needs_underlying_evidence
  - claim_id: claim_doc_intelligence_efficiency_75
    statement: Increased workflow efficiency by approximately 75% using S3 and Athena.
    verification_status: source_supported_needs_underlying_evidence

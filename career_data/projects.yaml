- project_id: fintechflow_banking_data_pipeline
  name: 'FintechFlow: Banking Data Pipeline on AWS'
  context: Cloud data engineering portfolio project
  status: developed
  summary: A production-oriented AWS banking data pipeline that simulates a UK bank's bronze, silver and
    gold data architecture.
  dataset:
    branches: 800
    customers: 1000000
    transactions: 3000000
    loans: 200000
    total_rows: 4200800
    data_characteristics: Synthetic data with deliberately injected nulls, duplicates, inconsistent values
      and invalid records.
  architecture:
  - Generate synthetic banking data using Python and Faker.
  - Ingest raw CSVs to an Amazon S3 bronze layer with boto3.
  - Register schemas using AWS Glue Crawler and Glue Data Catalog.
  - Validate raw data with Amazon Athena.
  - Clean and transform data using AWS Glue Python Shell jobs into Parquet silver tables.
  - Create gold analytical marts using dbt and Athena.
  - Prepare Tableau or QuickSight-ready datasets for branch, customer and loan analysis.
  technologies:
  - Python
  - Pandas
  - Faker
  - boto3
  - Amazon S3
  - AWS Glue
  - Glue Data Catalog
  - Amazon Athena
  - Parquet
  - dbt
  - Tableau
  - Amazon QuickSight
  - AWS IAM
  - AWS Secrets Manager
  - SQL
  outcomes:

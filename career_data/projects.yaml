- project_id: world_mask_catalog_automation
  name: World Mask Catalog Automation
  context: Personal automation and cultural heritage project
  status: live_at_time_of_article
  summary: An automated content pipeline that selects the next unposted mask from an Excel catalog, pairs
    it with an image and publishes a scheduled daily post to X.
  architecture:
  - Excel catalog as the structured content source and publication ledger.
  - Python script selects the first record where Posted? is not Y.
  - Script checks the corresponding image and prepares the post.
  - Dry-run mode previews the selected mask, image, post and character count.
  - The --live flag enables publication through the X API.
  - GitHub Actions schedules the workflow.
  - After successful publication, the script changes the record from N to Y and commits the updated catalog.
  technologies:
  - Excel
  - Python
  - X API
  - Git
  - GitHub
  - GitHub Actions
  outcomes:
